# Example only. Merge carefully with existing proxy configuration.
# These zones belong in nginx's http context, not inside server.
limit_conn_zone $binary_remote_addr zone=sonar_connections:1m;
limit_req_zone $binary_remote_addr zone=sonar_requests:1m rate=10r/s;
server {
    listen 443 ssl;
    server_name records.example.org;
    ssl_certificate /etc/letsencrypt/live/records.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/records.example.org/privkey.pem;
    client_max_body_size 34m;
    client_body_timeout 30s;
    limit_conn sonar_connections 2;
    limit_req zone=sonar_requests burst=20 nodelay;
    location / {
        proxy_pass http://127.0.0.1:8093;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
